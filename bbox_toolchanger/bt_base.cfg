#-------------------------------------------------------------------------------
[gcode_macro _BT_VARIABLES]

#-[ Physical values ]-----------------------------------------------------------

# Docking bay positions for each tool (X position only)
# Note: The number of items in this array also determines the total number of
# physical tool slots available in the toolchanger. It is expected that you will
# override this placeholder value by editing your ./bt_config/bt_customize.cfg 
# file to match your machine's tool count and docking bay positions
variable_x_locs: [10000]

# Docking motion values
variable_dock_y: 10000          # This is the Y position when a tool is fully engaged into its docking bay
variable_dock_safe_y: -28       # Amount to add to dock_y for a "safe" position in front of the dock that should be clear of any tools in the dock

variable_dock_shift_x: 3.5      # Amount to move toolhead laterally (when in docking bay) to open/close extruder swing arm
#SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=dock_dodge_y VALUE=-14
#variable_dock_dodge_y: -16      # Relative displacement from dock_y for when we can open/close extruder
#variable_dock_dodge_y: -14      # Relative displacement from dock_y for when we can open/close extruder
variable_dock_dodge_y: -10      # Relative displacement from dock_y for when we can open/close extruder, smaller value means more of the extruder swing arm is engaged by standoff

# Dock/Undock movement speeds. 
#   * feed_fast is speed used to enter and exit docking bay
#   * feed_slow is speed for shorter movements within the docking bay to open/close the extruder swing arm and to ensure the tool is fully seated into the dock
# To go really slow (for initial testing): SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=feed_fast VALUE=2000
# To go *very* fast (700mm/s): SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=feed_fast VALUE=42000
# To go fast (500mm/s): SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=feed_fast VALUE=30000
# To go conservative (300mm/s): SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=feed_fast VALUE=18000
variable_feed_fast:   30000     # 500mm/s
variable_feed_slow:   5000      # 83.33mm/s

# Travel speed to/from docking bay entrance
# SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=travel_spd VALUE=12000
variable_travel_spd:  30000     # 500mm/s

# Acceleration to use during tool changes. We want this to be high enough to minimize time spent during tool changes,
# Note: This is only applied during the tool change sequence (moving into/out of the dock), after the tool change is 
# complete we switch back to the regular acceleration values for printing and travel moves.
# Adjust this based on your printer's capabilities
# SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=accel_toolchange VALUE=15000
variable_accel_toolchange: 25000     

#-[ Configuration values ]------------------------------------------------------

# Scale factor for M106 fan speed command. This is useful if you're using an overdriven part cooling fan
# and want to reduce its speed to match a regular fan (say due to noise or overcooling)
# SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=fan_scale VALUE=1.0
variable_fan_scale: 1.0

# These three are used to specify which axis positions to restore after a tool change. Set to 1 to enable 
# restoration of that axis, or 0 to leave it as-is. If Z axis is restored, it will actually be restored 0.2mm higher
# Note: If the toolchange command is issued while tool is over the printed part, do not restore the position.
# There is a feature in OrcaSlicer introduced with v2.40alpha for "Tool change on wipe tower" that
# would make restoring the position possibly useful. But that feature also has a bug with print time estimates 
# (it ignores tool change time). Also early experiments did not work out too well as I actually seemed to have more
# blobs that proved troubblesome as they would be on the surface of the tower rather than on the side
variable_restore_after_toolchange_x: 0
variable_restore_after_toolchange_y: 0
variable_restore_after_toolchange_z: 0

# When changing tools we increase Z by this height before performing the toolchange
# this is to avoid dragging the tool over the printed part
variable_z_safety_height: 0.2

# How much to retract/unretract when docking a tool
# SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=method0_retract_length VALUE=1.5
variable_method0_retract_length: 0

# How much to unretract when undocking a tool
# SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=method0_unretract_length VALUE=0.9
variable_method0_unretract_length: 0

#-[ State values ]--------------------------------------------------------------
variable_current_tool: -1   # -1 = no tool loaded (always a physical index, set after virtual→physical resolution)

# Virtual tool mapping: virtual_map[virtual_index] = physical_index
# Default is identity (no remapping). Loaded from save_variables on startup via Python.
# Update via the sidecar's Tool Assignment panel (sends BT_SET_TOOL_MAP).
variable_virtual_map: [0, 1, 2, 3]

# Per-physical-tool filament data. Loaded from save_variables on startup via Python.
# Update via the sidecar's Tool Assignment panel (sends BT_SET_GATE_MAP).
variable_filament_colors: ['', '', '', '']
variable_gate_material:   ['', '', '', '', '', '', '', '']
variable_gate_name:       ['', '', '', '', '', '', '', '']
variable_gate_temp:       [0, 0, 0, 0, 0, 0, 0, 0]

# X/Y/Z gcode offsets per physical tool slot, assembled by Python at startup from each
# tool's variable_tool_offset_N: [x, y, z] line in bt_customize.cfg (the source of truth —
# see BT_SAVE_TOOL_OFFSET). Tools with no tool_offset_N entry there default to [0, 0, 0].
variable_tool_offsets: []

# Per-tool singular offset vars — must be pre-declared here (Klipper's SET_GCODE_VARIABLE
# can only update a variable that's already declared via variable_X: somewhere, never create
# a new one at runtime), so BT_SAVE_TOOL_OFFSET can push a live update the moment it writes
# bt_customize.cfg, without waiting for a RESTART. bt_customize.cfg overrides these with real
# calibrated values once a tool has been saved. Sized generously to 16 tools — unused slots on
# smaller toolchangers are simply never read (sync_and_init_arrays only loops range(num_tools)).
variable_tool_offset_0:  [0.0, 0.0, 0.0]
variable_tool_offset_1:  [0.0, 0.0, 0.0]
variable_tool_offset_2:  [0.0, 0.0, 0.0]
variable_tool_offset_3:  [0.0, 0.0, 0.0]
variable_tool_offset_4:  [0.0, 0.0, 0.0]
variable_tool_offset_5:  [0.0, 0.0, 0.0]
variable_tool_offset_6:  [0.0, 0.0, 0.0]
variable_tool_offset_7:  [0.0, 0.0, 0.0]
variable_tool_offset_8:  [0.0, 0.0, 0.0]
variable_tool_offset_9:  [0.0, 0.0, 0.0]
variable_tool_offset_10: [0.0, 0.0, 0.0]
variable_tool_offset_11: [0.0, 0.0, 0.0]
variable_tool_offset_12: [0.0, 0.0, 0.0]
variable_tool_offset_13: [0.0, 0.0, 0.0]
variable_tool_offset_14: [0.0, 0.0, 0.0]
variable_tool_offset_15: [0.0, 0.0, 0.0]

variable_z_baby_step: 0.0           # Transient: accumulated Z baby-step delta (live offset minus calibrated tool Z offset); preserved across tool changes
variable_saved_fan_speed: 0         # Transient: fan S value (0-255) saved at toolchange start, restored after

variable_last_zprobe: -1.0          # Physical Z (raw stepper coords) of the last ZPROBE_TOOL_OFFSET trigger; set by Python. Set to -1.0 if unknown/invalid.

# Per-virtual-tool print info provided by BT_SET_TOOL_INFO at print start.
# Indexed by virtual tool. Defaults to 8 slots; BT_SET_TOOL_INFO expands dynamically if needed.
# Reset to zero/empty by BT_PRINT_RESET at print start and end.
variable_tool_init_temps: [0, 0, 0, 0, 0, 0, 0, 0]   # First-layer temperatures from slicer
variable_tool_run_temps:  [0, 0, 0, 0, 0, 0, 0, 0]   # Running temperatures from slicer
variable_tool_types:      ['', '', '', '', '', '', '', '']  # Filament type strings from slicer

#-[ Stats ]---------------------------------------------------------------------
variable_total_changes: 0
variable_success_streak: 0
variable_success_streak_printing: 0   # Tracks the number of successful tool changes during a print
variable_expected_changes: 0          # This is set at the start of a print based on the number of tool changes we expect to see in the G-code. Used to help determine if a failed tool change was due to a tool change failure or just that we haven't gotten to that tool change in the print yet.
variable_record_high: 0        # <--- The "High Score"
variable_tool_usage: []


#-[ Misc ]----------------------------------------------------------------------
#SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=priming_enabled VALUE=0
variable_priming_enabled: 1

gcode:


#-------------------------------------------------------------------------------
# These are requested target heater values from an M104 command issued by the 
# slicer. This means M104/M109 commands that are issued with a T parameter
# are specifying the *virtual* tool. We convert the virtual tool to its corresponding
# physical tool and these variables represent the *physical* tool targets.
[gcode_macro _TARGET_TEMPERATURE_VARIABLES]
variable_t0_target: 0
variable_t1_target: 0
variable_t2_target: 0
variable_t3_target: 0
variable_t4_target: 0
variable_t5_target: 0
variable_t6_target: 0
variable_t7_target: 0

gcode:


#------------------------------------------------------------------------------
[gcode_macro _BT_HOME_XY_IF_NEEDED]
description: Homes X and Y if either is not already homed. Used by the sidecar's slow/safe dock and undock test wizards, which disable motors (M84) before letting the user manually position the gantry — Klipper loses X/Y position reference once motors are disabled, so a re-home is required before any automated move.
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

#------------------------------------------------------------------------------
[gcode_macro _MOVE_TO_DOCKING_BAY_ENTRANCE]
description: Zeroes out any x/y/z offsets and then moves toolhead to docking bay entrance for the specified (physical) tool
gcode:
    # Internal helper: TOOL parameter is always a physical bay index.
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set physical_tool = params.TOOL|int %}
    {% set tool_count = vars.x_locs|length %}

    {% if physical_tool < 0 or physical_tool >= tool_count %}
        {action_raise_error("Invalid tool index")}
    {% endif %}

    # Zero out any offsets so they don't interfere with movement to the tool bay.
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    {% set dock_x = vars.x_locs[physical_tool] %}
    {% set dock_y = vars.dock_y %}
    {% set safe_y  = vars.dock_safe_y %}
    {% set feed_fast = vars.feed_fast %}

    # Move to entry point in front of the dock
    G90 
    G0 X{dock_x} Y{dock_y + safe_y} F{feed_fast}
    
#------------------------------------------------------------------------------
[gcode_macro _BT_DO_UNLOAD_TOOL]
description: Unloads the attached tool into its respective docking bay. If TOOL parameter is provided, unload will be into that specific docking bay. Note: No filament rectract is performed
gcode:
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set physical_tool = params.TOOL|default(vars.current_tool)|int %}
    {% if physical_tool != -1 %}
        {% set dock_x = vars.x_locs[physical_tool] %}
        {% set dock_y = vars.dock_y %}
        {% set shift_x = vars.dock_shift_x %}
        {% set dodge_y = vars.dock_dodge_y %}
        {% set safe_y  = vars.dock_safe_y %}
        

        # Move to docking bay entrance for this tool
        _MOVE_TO_DOCKING_BAY_ENTRANCE TOOL={physical_tool}
        
        # Move completely into docking bay
        # This causes the two screws at back of hotend to enter two keyed holes in the docking bay
        G0 X{dock_x} Y{dock_y} F{vars.feed_fast}

        _DROPOFF_SETUP TOOL={physical_tool}
        
        # Move laterally to open the extruder swing arm and cause the hotend screws at back of the tool to magnetically attach to the dock
        # as well as lock into position with the keyed holes in the dock
        G0 X{dock_x + shift_x} Y{dock_y} F{vars.feed_slow}

        # Back out of the dock a small amount to detach the hotend from the toolhead   
        G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{vars.feed_slow}
        
        # Reverse the lateral movement to close the extruder swing arm
        G0 X{dock_x} Y{dock_y + dodge_y} F{vars.feed_slow}
        
        # Exit the dock completely (move back to dock entrance)
        G0 X{dock_x} Y{dock_y + safe_y} F{vars.feed_fast}
#        G4 P100
    {% endif %}

# We no longer update "current_tool" as this is the responsibility of the caller (_BT_LOAD_TOOL in Python) after it calls _BT_DO_LOAD_TOOL. 
#    SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=current_tool VALUE=-1    


#------------------------------------------------------------------------------
[gcode_macro _BT_DO_LOAD_TOOL]
description: Loads the specified (physical) tool. Just before it exits the dock (after attaching the tool) it calls: "PICKUP_SETUP prime=1" which might wait for hotend to reach temperature and perform a prime
gcode:
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}

    {% set physical_tool = params.TOOL|default(-1)|int %}
    {% if physical_tool == -1 %}
        {action_respond_info("Tool must be specified")}
    {% else %}
        {% set dock_x =  vars.x_locs[physical_tool] %}
        {% set dock_y = vars.dock_y %}
        {% set shift_x = vars.dock_shift_x %}
        {% set dodge_y = vars.dock_dodge_y %}
        {% set safe_y  = vars.dock_safe_y %}

        # Move to docking bay entrance for this tool
        _MOVE_TO_DOCKING_BAY_ENTRANCE TOOL={physical_tool}

        # Move a little into the docking bay, just enough so that our next step (lateral movement)
        # will allow the swing arm to touch the swing arm support rod, but not so far that the print head hits the parked hot end    
        G0 X{dock_x} Y{dock_y + dodge_y} F{vars.feed_fast}
        
        # Move laterally to open the extruder swing arm
        G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{vars.feed_slow}
        
        # Move completely into the dock
        G0 X{dock_x + shift_x} Y{dock_y} F{vars.feed_slow}
        G4 P100
        
        # Reverse the lateral movement to close the extruder
        G0 X{dock_x} Y{dock_y} F{vars.feed_slow}

        # Before exiting the dock we want to perform any necessary wait for heater temperature as well
        # as any unretract priming so that our nozzle stop can stop any oozing. We use _PICKUP_SETUP_TOOL for this
        _PICKUP_SETUP TOOL={physical_tool} PRIME=1

        # Exit the dock completely (ending up at the dock entrance)
        G0 X{dock_x} Y{dock_y + safe_y} F{vars.feed_fast}
#        G4 P100

        # Note: We do not perform the following commented out code because this method is is a lower
        # level function that is meant to only perform the act of loading the tool (although it
        # may indirectly setup tool heater and perform a primee). So it is the caller's reponsibility
        # BT_CHANGE_TOOL in Python to perform any additional actions after the tool is loaded such as moving to a safe location, applying tool offsets, and restoring XY positions if desired. 
        # This is because BT_CHANGE_TOOL has more context about the overall print state and can make smarter decisions about what to do after loading the tool. For example if we apply offsets

        # # Apply X/Y/Z offsets for this tool so that it's properly registered in the correct position relative to the bed and other tools. 
        # # We apply the offsets at the end after we're fully clear of the dock
        # {% set offsets = vars.tool_offsets[physical_tool] if physical_tool < vars.tool_offsets|length else [0, 0, 0] %}
        # SET_GCODE_OFFSET X={offsets[0]} Y={offsets[1]} Z={offsets[2]} MOVE=0

# We no longer update "current_tool" as this is the responsibility of the caller (_BT_UNLOAD_TOOL in Python) after it calls _BT_DO_UNLOAD_TOOL. 
#        # Update current_tool with the physical tool index
#        SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=current_tool VALUE={physical_tool}
    {% endif %}

#-------------------------------------------------------------------------------
# Called by _BT_DO_LOAD_TOOL just after it attaches to the tool but before it exits the dock 
# This will check if the tool's heater has a non-zero target temperature and wil set the hotend heater to that temperature .
# If parameter PRIME is set to 1 then it will also wait for the tool to reach temperature and then perform a short prime to ensure filament is in the melt zone and ready for printing.
[gcode_macro _PICKUP_SETUP]
gcode:
    # TOOL is the physical tool index (already resolved by BT_CHANGE_TOOL Python before calling here).
    # (slicer stores M104 targets under the virtual key). Defaults to TOOL for callers that omit it.
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set physical_tool = params.TOOL|int %}
    {% set prime = params.PRIME|default(0)|int %}

    # Get recorded M104/M109 target for this physical tool
    {% set tool_temp_vars = printer["gcode_macro _TARGET_TEMPERATURE_VARIABLES"] %}
    {% set s = tool_temp_vars["t" ~ physical_tool ~ "_target"]|default(0)|float %}

    # Set hotend heater using physical_tool so the correct heater is targeted
    _SET_HOTEND_HEATER_TEMP T={physical_tool} S={s} WAIT={prime} CODE="_PICKUP_SETUP"

    # If nozzle is to be primed and target temperature is greater than a standby temperature and at least a minimum printing temperature then perform a prime
    {% if prime == 1 and s > 190 %}
        # 1. Force Klipper to finish the TEMPERATURE_WAIT in the _SET_HOTEND_HEATER_TEMP macro
        # 2. M400 ensures the move/wait queue is empty
        M400 

        # 3. Use the G-code version of a log, NOT the Jinja {% %} version
        #{action_respond_info("_PICKUP_SETUP priming T" ~ t ~ " ")}
#        RESPOND MSG="Temp reached. Starting prime extrude."

        # Unretract        
        G91
        M83
        G1 E{vars.method0_unretract_length} F1800
        G90
        M400            # Ensure the prime is completed before we exit the dock
    {% endif %}

#-------------------------------------------------------------------------------
# Called by _BT_DO_UNLOAD_TOOL just after it pushes tool into docking bay but 
# before it exits the dock.
# Sets the tool heater to either 0 or a specified standby temperature (STANDBY)
# Prepares the filament for docking (tip form and retract).
[gcode_macro _DROPOFF_SETUP]
gcode:
    # TOOL is the physical tool index (already resolved by BT_CHANGE_TOOL Python before calling here).
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set physical_tool = params.TOOL|int %}

    # Perform tip form/retract — pass physical_tool so heater name resolution is correct
    _PREP_FILAMENT_FOR_DOCKING TOOL={physical_tool}

#-------------------------------------------------------------------------------
# Prepares the filament for docking (tip form and retract).
[gcode_macro _PREP_FILAMENT_FOR_DOCKING]
gcode:
    # Internal helper: TOOL parameter is always a physical index.
    # When called from _DROPOFF_SETUP the resolution has already occurred.
    # When no TOOL param is provided, current_tool is used (always physical).
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set physical_tool = params.TOOL|default(vars.current_tool)|int %}
    {% set tool_count = vars.x_locs|length %}

    {% if physical_tool != -1 %}
        # Determine if temperature is high enough to perform a retraction
        {% set heater_id = "extruder" if physical_tool == 0 else "extruder" ~ physical_tool %}
        {% set temperature = printer[heater_id].temperature if heater_id in printer else 0 %}
#        {action_respond_info("Temperature for Tool " ~ t ~ " " ~ heater_id ~ " is " ~ temperature ~ "C")}
        {% if temperature >= 195 %}
            # Retract
            G91
            M83
            G1 E-{vars.method0_retract_length} F1800
            G90
        {% else %}
#            {action_respond_info("Retract skipped for Tool " ~ t)}
        {% endif %}
    {% endif %}


#------------------------------------------------------------------------------
[gcode_macro BT_RESET]
description: Reset toolchanger state. Basically sets its known "current tool" to Unknown (-1)`)
gcode:
    SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=current_tool VALUE=-1
    {action_respond_info("Toolchanger state reset: no tool loaded")}

    # 1. Clear the physical motor away from any virtual motion queues
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=""
    # 2. Update the active extruder to be the primary extruder so that Klipper and Mainsail's internal state is correct
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    # 3. Synchronize the physical stepper back to the primary extruder queue
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder


#------------------------------------------------------------------------------
[gcode_macro BT_UNSELECT_TOOL]
description: Unload the current tool and return to no-tool state
gcode:
    BT_CHANGE_TOOL TOOL=-1

#------------------------------------------------------------------------------
# _BT_TEST_TOOL TESTS=1 TOOL=2
# Macro version of BT_TEST_TOOL. This is useful only if you don't have the Python
# extension installed (say during testing/development)
[gcode_macro _BT_TEST_TOOL]
description: Tests loading and unloading of specified tool (TOOL) for the specified number of times (TESTS)
gcode:
    {% set tests = params.TESTS|default(1)|int %}
    {% set tool = params.TOOL|default(0)|int %}

    {% for loop_idx in range(tests) %}
        BT_CHANGE_TOOL TOOL={tool}
        BT_CHANGE_TOOL TOOL=-1
    {% endfor %}

#------------------------------------------------------------------------------
[gcode_macro TURN_OFF_HEATERS]
rename_existing: _BASE_TURN_OFF_HEATERS
gcode:
    # Call the original Klipper command for Bed/Extruder
    _BASE_TURN_OFF_HEATERS
    
    # # Set temperature of all listed heaters to 0
    # # Note: This will turn off *all* heaters including bed and chamber heaters
    # {% for h in printer.heaters.available_heaters %}
    #   SET_HEATER_TEMPERATURE HEATER={h} TARGET=0
    # {% endfor %}

    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set tool_count = vars.x_locs|length %}
    {% for tool in range(tool_count) %}
        {action_respond_info("Turning off heater for tool " ~ tool)}
        _SET_HOTEND_HEATER_TEMP T={tool} S=0 CODE="TURN_OFF_HEATERS"
    {% endfor %}

    {action_respond_info("All heaters turned off.")}

#------------------------------------------------------------------------------
# Resets all print-scoped toolchanger state. Called by PRINT_START (before the
# first M104/M109) and by BT_PRINT_END after a print completes.
# - Zeros all hotend heater targets except the active tool
# - Resets BT_SET_TOOL_INFO variables (tool_init_temps, tool_run_temps, tool_types).
# - Resets all _TARGET_TEMPERATURE_VARIABLES targets (t0–t7).
[gcode_macro BT_PRINT_RESET]
description: Reset all print-scoped toolchanger state — heater targets, and tool info table
gcode:
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set current = vars.current_tool|int %}
    {% set tool_count = vars.x_locs|length %}

    # Reset BT_SET_TOOL_INFO table to 8-slot zero/empty defaults
    SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=tool_init_temps VALUE='[0,0,0,0,0,0,0,0]'
    SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=tool_run_temps VALUE='[0,0,0,0,0,0,0,0]'
    SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=tool_types VALUE='["","","","","","","",""]'

    # Reset all _TARGET_TEMPERATURE_VARIABLES targets (t0–t7)
    {% for i in range(8) %}
        SET_GCODE_VARIABLE MACRO=_TARGET_TEMPERATURE_VARIABLES VARIABLE=t{i}_target VALUE=0
    {% endfor %}

#------------------------------------------------------------------------------
# Toolchanger teardown sequence called by PRINT_END.
# Unloads the active tool, closes the extruder, and resets all print-scoped state.
[gcode_macro BT_PRINT_END]
description: Toolchanger teardown — unload tool, close extruder, reset print state
gcode:
    BT_UNSELECT_TOOL
    BT_FLUSH_STATS
    BT_PRINT_RESET

#------------------------------------------------------------------------------
# This is called by BT_CHANGE_TOOL when a tool change is requested while a
# print is active and does not think you have a PAUSE macro available for it to
# call. This should perform any necessary actions to safely abort the print
[gcode_macro _BT_ABORT_PRINT]
description: Abort the print safely in the middle of a tool change when no PAUSE macro is available
gcode:
    TURN_OFF_HEATERS # This will now use your new TURN_OFF_HEATERS macro above
    CANCEL_PRINT

#------------------------------------------------------------------------------
[idle_timeout]
gcode:
    TURN_OFF_HEATERS # This will now use your new TURN_OFF_HEATERS macro above
    G28 Z            # Home Z so that bed will not drop when we turn off motors
    M84              # Turn off motors

#-------------------------------------------------------------------------------
[gcode_macro _BEFORE_TOOLCHANGE]
gcode:
    # Save current fan speed as macro variable (transient, no disk I/O).
    # M107 turns off the fan. Fan is restored by _AFTER_TOOLCHANGE once the tool swap completes.
    # Z safety lift is handled by BT_CHANGE_TOOL Python before this macro is called.
    {% set fan_s = (printer.fan.speed * 255)|int %}
    SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=saved_fan_speed VALUE={fan_s}
    M107

#-------------------------------------------------------------------------------
[gcode_macro _AFTER_TOOLCHANGE]
gcode:
  {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
  {% if vars.saved_fan_speed > 0 %}
    M106.1 S{vars.saved_fan_speed}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=saved_fan_speed VALUE=0

#-------------------------------------------------------------------------------
# M106/M107 overrides: apply fan_scale factor so an overdriven fan runs at a proportional speed.
# _AFTER_TOOLCHANGE bypasses these by calling M106.1 directly to restore the exact physical speed.
[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
  {% set scale = vars.fan_scale|float %}
  {% if params.S is defined %}
    {% set raw = params.S|float * scale %}
