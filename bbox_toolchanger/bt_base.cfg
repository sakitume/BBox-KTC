[gcode_macro BT_SET_TOOL_INFO]
description: Record slicer-provided filament info for a virtual tool slot. All params except TOOL are optional.
gcode:
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set tool = params.TOOL|int %}

    # Update tool_init_temps if INIT was provided
    {% if params.INIT is defined %}
        {% set val = params.INIT|float %}
        {% set cur = vars.tool_init_temps %}
        {% set ns = namespace(lst=[], list_len=cur|length) %}
        {% if tool >= ns.list_len %}{% set ns.list_len = tool + 1 %}{% endif %}
        {% for i in range(ns.list_len) %}
            {% if i == tool %}
                {% set ns.lst = ns.lst + [val] %}
            {% elif i < cur|length %}
                {% set ns.lst = ns.lst + [cur[i]|float] %}
            {% else %}
                {% set ns.lst = ns.lst + [0.0] %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=tool_init_temps VALUE='{ns.lst}'
        RESPOND MSG="BT_SET_TOOL_INFO T{tool}: INIT={val}"
    {% endif %}

    # Update tool_run_temps if RUN was provided
    {% if params.RUN is defined %}
        {% set val = params.RUN|float %}
        {% set cur = vars.tool_run_temps %}
        {% set ns = namespace(lst=[], list_len=cur|length) %}
        {% if tool >= ns.list_len %}{% set ns.list_len = tool + 1 %}{% endif %}
        {% for i in range(ns.list_len) %}
            {% if i == tool %}
                {% set ns.lst = ns.lst + [val] %}
            {% elif i < cur|length %}
                {% set ns.lst = ns.lst + [cur[i]|float] %}
            {% else %}
                {% set ns.lst = ns.lst + [0.0] %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=tool_run_temps VALUE='{ns.lst}'
        RESPOND MSG="BT_SET_TOOL_INFO T{tool}: RUN={val}"
    {% endif %}

    # Update tool_types if TYPE was provided
    {% if params.TYPE is defined %}
        {% set val = params.TYPE|string %}
        {% set cur = vars.tool_types %}
        {% set ns = namespace(parts=[], list_len=cur|length) %}
        {% if tool >= ns.list_len %}{% set ns.list_len = tool + 1 %}{% endif %}
        {% for i in range(ns.list_len) %}
            {% if i == tool %}
                {% set ns.parts = ns.parts + ['"' ~ val ~ '"'] %}
            {% elif i < cur|length %}
                {% set ns.parts = ns.parts + ['"' ~ cur[i] ~ '"'] %}
            {% else %}
                {% set ns.parts = ns.parts + ['""'] %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_BT_VARIABLES VARIABLE=tool_types VALUE='[{ns.parts|join(",")}]'
        RESPOND MSG="BT_SET_TOOL_INFO T{tool}: TYPE={val}"
    {% endif %}



#=====================================================
# This macro is designed to prime each tool before starting a print. 
# It performs a sequential colinear purge for each tool, which helps to ensure 
# that the nozzle is clean and ready for printing. The macro also includes a small 
# wipe move at the end of each purge line to break the "tail" of the extruded filament, 
# which can help to prevent stringing and improve print quality.
[gcode_macro BT_PRIME_TOOLS]
description: Primes each tool before starting a print.

# Note: Be mindful of these coordinates as a tool may have an x/y/z offset that
# is large enough to offset a position that would go outside the bounds of the printers ability
# and trigger an error. position_min for y is -2.0 and for x is -5.0 and for z is -4.0
variable_purge_y: 1
variable_park_x: 1
variable_park_y: 1
variable_park_z: 3
gcode:
    # --- Configuration ---
    {% set bt_vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% if bt_vars.priming_enabled != 0 %}
        {% set vars = printer["gcode_macro BT_PRIME_TOOLS"] %}
        {% set used_tools = params.TOOLS|default("1,0,0,0,0,0") %}
        {% set tools_list = used_tools.split(',') %}

        # Layout Settings
        {% set start_x = 2 %}
        {% set line_length = 32 %}
        {% set wipe_dist = 5 %}
        {% set gap = 6 %}
        {% set row_spacing = 3 %} # How far to move in Y for a new row

        # Extrusion Settings
        {% set extrude_amt = 25 %}

        # Note: Adjust this as needed
        {% set max_x_limit = 210 %}


        # --- Use a Namespace to persist X/Y changes across the loop ---
        {% set pos = namespace(x=start_x, y=vars.purge_y) %}

        G90 ; Absolute positioning
        M83 ; Relative extrusion

        # --- Step 1: Pre-heat only the used tools ---
        # Note: No longer pre-heating all used tools to avoid drawing so much power on startup
        # {% for i in range(tools_list|length) %}
        #     {% if tools_list[i]|lower == 'true' or tools_list[i] == '1' %}
        #         {% set run_temp = bt_vars.tool_run_temps[i]|default(0)|float %}
        #         {% set tool_temp = run_temp if run_temp > 0 else 225 %}
        #         M117 Pre-heating T{i}
        #         M104 T{i} S{(tool_temp - 50)|int}
        #     {% endif %}
        # {% endfor %}

        # --- Step 2: Sequential Purge with Row Wrapping ---
        {% for i in range(tools_list|length) %}
            {% if tools_list[i]|lower == 'true' or tools_list[i] == '1' %}

                # Check if this tool fits on the current line
                # If (current X + length + wipe) exceeds our limit, reset X and bump Y
                {% if pos.x + line_length + wipe_dist > max_x_limit %}
                    {% set pos.x = start_x %}
                    {% set pos.y = pos.y + row_spacing %}
                {% endif %}

                {% set run_temp = bt_vars.tool_run_temps[i]|default(0)|float %}
                {% set tool_temp = run_temp if run_temp > 0 else 225 %}

                M117 Priming T{i}...
                M104 T{i} S{tool_temp}    # Set target temp *BEFORE* changing to the tool so it will be able to unretract
                T{i} ; Toolchange

                {% if True %}
                    # Move to start position for this tool
                    G90
                    G0 Z5 F5000 
                    G0 X{pos.x} Y{pos.y} F30000 # 500mm/s travel

                    # --- The "Stability" Move ---
                    G0 Z0.5                   # Drop to slightly above purge height
                    G4 P500                   # Wait 500ms for pressure to settle
                    M83
                    G92 E0 
                    G1 E2 F200                # Small "anchor" blob
                    
                    # --- The Purge Line ---
    #                G0 Z0.15                  # Drop to actual purge height
                    G0 Z0.3                   # Drop to actual purge height
                    G92 E0 
    #                G1 X{pos.x + line_length} E{extrude_amt} F500 
                    G1 X{pos.x + line_length} E{extrude_amt} F400 
                    
                    # --- The Tail Breaker ---
                    # Lift slightly before the wipe to prevent "dragging" the tail
                    G0 Z0.4 F3000                
                    G1 X{pos.x + line_length + wipe_dist} F1200 # Faster wipe
                    G92 E0 
                    G1 E-1.0 F3000            # Faster retract to snap filament
                    G0 Z3 F3000               # Quick lift
                {% else %}
                    # Move to start position for this tool
                    G0 Z5 F5000 
                    G0 X{pos.x} Y{pos.y} F5000 
                    G0 Z0.15 
                    
                    # Execute Purge Line
                    G92 E0 
                    G1 X{pos.x + line_length} E{extrude_amt} F500 
                    
                    # --- Small Wipe Move ---
                    G1 X{pos.x + line_length + wipe_dist} F1000
                    G92 E0 
                    G1 E-1 F500 ; Small retraction
                    
                    # Lift to clear the line
                    G0 Z2 F3000
                {% endif %}

                # Increment X for the next tool in this row
                {% set pos.x = pos.x + line_length + wipe_dist + gap %}

                # Turn off the heater for this tool to reduce ooze
                M104 S0 T{i}
            {% endif %}
        {% endfor %}

        # --- Step 3: Final Park ---
        BT_UNSELECT_TOOL
        M117 Tools Primed. Parking...
        G0 Z{vars.park_z} F3000
        G0 X{vars.park_x} Y{vars.park_y} F6000
    {% endif %}

