#-------------------------------------------------------------------------------
[gcode_macro M104]
rename_existing: M104.1
gcode:
    # Entry point: params.T from slicer is a virtual tool index.
    # When no T is provided, fall back to current_tool which is always physical.
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set s = params.S|default(0)|float %}

    {% if params.T is defined %}
        # T was provided by the slicer — it is a virtual index
        {% set virtual_tool = params.T|int %}
        {% set physical_tool = vars.virtual_map[virtual_tool] %}
    {% else %}
        # No T provided — operate on the currently loaded physical tool
        {% set physical_tool = vars.current_tool|default(-1)|int %}
        {% set virtual_tool = physical_tool %}
    {% endif %}

    {% if physical_tool >= 0 %}
        SET_GCODE_VARIABLE MACRO=_TARGET_TEMPERATURE_VARIABLES VARIABLE=t{physical_tool}_target VALUE={s}
    {% endif %}
    _SET_HOTEND_HEATER_TEMP T={physical_tool} S={s} WAIT=0 CODE="M104"

#-------------------------------------------------------------------------------
[gcode_macro M109]
rename_existing: M109.1
gcode:
    # Entry point: params.T from slicer is a virtual tool index.
    # When no T is provided, fall back to current_tool which is always physical.
    {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
    {% set s = params.S|default(0)|float %}

    {% if params.T is defined %}
        {% set virtual_tool = params.T|int %}
        {% set physical_tool = vars.virtual_map[virtual_tool] %}
    {% else %}
        {% set physical_tool = vars.current_tool|default(-1)|int %}
    {% endif %}

    # Save target under physical key for later use by _PICKUP_SETUP
    {% if physical_tool >= 0 %}
        SET_GCODE_VARIABLE MACRO=_TARGET_TEMPERATURE_VARIABLES VARIABLE=t{physical_tool}_target VALUE={s}
    {% endif %}
    # Pass physical_tool to the heater macro
    _SET_HOTEND_HEATER_TEMP T={physical_tool} S={s} WAIT=1 CODE="M109"

#-------------------------------------------------------------------------------
[gcode_macro _SET_HOTEND_HEATER_TEMP]
gcode:
    # Internal helper: T parameter is always a physical tool index.
    # All callers resolve virtual→physical before calling this macro.
    # current_tool (used as default) is always physical.
    {% if True %}
        {% set s = params.S|default(0)|int %}
        {% set physical_tool = params.T|default(printer["gcode_macro _BT_VARIABLES"].current_tool)|default(-1)|int %}

        {% set code = params.CODE|default("No Code")|string %}
        {% set wait = params.WAIT|default(0)|int %}
        {% set vars = printer["gcode_macro _BT_VARIABLES"] %}
        {% set tool_count = vars.x_locs|length %}

        # If physical_tool is -1 it means no T parameter was provided and current_tool has not been
        # set yet (it is -1 by default). In this case we will treat it as if T0 was intended.
        # This occurs at the start of a print due to PRINT_START gcode having a M109 S{first_layer_temp} without a T parameter.
        {% if physical_tool == -1 %}
            {% set physical_tool = 0 %}
            # Save the target temperature for all tools as there's a bug in Orcaslicer where
            # at start of a print it uses T1 but there was never a M109 or M104 with T1 parameter
            # but there was an M104 without a T parameter (which we interperet as T == -1)
            {% for loop_idx in range(tool_count) %}
                SET_GCODE_VARIABLE MACRO=_TARGET_TEMPERATURE_VARIABLES VARIABLE=t{loop_idx}_target VALUE={s}
            {% endfor %}
        {% endif %}

        {% if physical_tool >= 0 and physical_tool < tool_count %}
#            {action_respond_info("_SET_HOTEND_HEATER_TEMP s=" ~ s ~ " physical_tool=" ~ physical_tool ~ " code=" ~ code ~ " wait=" ~ wait)}
            # Identify which heater and sensor identifiers to use for this physical tool
            {% set heater = "extruder" if physical_tool == 0 else "extruder" ~ physical_tool %}
            {% set sensor = "extruder" if physical_tool == 0 else "extruder" ~ physical_tool %}

            # Heater setup is conditional on whether the heater actually exists in the config
            {% if sensor and sensor in printer.heaters.available_heaters %}
#                {action_respond_info(code ~ " physical T" ~ physical_tool ~ ": setting temperature " ~ s ~ "c" ~ " for heater " ~ heater)}
                SET_HEATER_TEMPERATURE HEATER={heater} TARGET={s}
                {% if s > 0 and wait %}
#                    {action_respond_info("Will wait for temperature " ~ s ~ "C" ~ " before continuing")}
                    TEMPERATURE_WAIT SENSOR="{sensor}" MINIMUM={s - 2} MAXIMUM={s + 5}
                {% endif %}
            {% else %}
                {action_respond_info(code ~ " physical T" ~ physical_tool ~ ": Heater " ~ heater ~ " not found, cannot set temperature")}
            {% endif %}
        {% else %}
            {action_respond_info(code ~ " physical T" ~ physical_tool ~ ": T index is out of range")}
        {% endif %}
    {% endif %}


[gcode_macro _TRACE_SQUARE]
description: Trace a square defined by two opposite corners
# Usage example:
# TRACE_SQUARE X1=50 Y1=50 X2=150 Y2=150 F=6000

gcode:
    {% set x1 = params.X1|default(5)|float %}
    {% set y1 = params.Y1|default(5)|float %}
    {% set x2 = params.X2|default(175)|float %}
    {% set y2 = params.Y2|default(175)|float %}
    {% set f  = params.F|default(6000)|float %}

    # Compute center
    {% set cx = (x1 + x2) / 2 %}
    {% set cy = (y1 + y2) / 2 %}

    # Determine corners
    {% set min_x = [x1, x2]|min %}
    {% set max_x = [x1, x2]|max %}
    {% set min_y = [y1, y2]|min %}
    {% set max_y = [y1, y2]|max %}

    # Corner definitions
    # Left-rear = (min_x, max_y)
    # Right-rear = (max_x, max_y)
    # Right-front = (max_x, min_y)
    # Left-front = (min_x, min_y)

    G90 ; absolute positioning

    # Move to center
    G0 X{cx} Y{cy} F{f}

    # Move to left-rear corner
#    G0 X{min_x} Y{max_y} F{f}

    # Trace square clockwise
    G0 X{max_x} Y{max_y} F{f} ; right-rear
    G0 X{max_x} Y{min_y} F{f} ; right-front
    G0 X{min_x} Y{min_y} F{f} ; left-front
    G0 X{min_x} Y{max_y} F{f} ; back to left-rear

    # Return to center
    G0 X{cx} Y{cy} F{f}



