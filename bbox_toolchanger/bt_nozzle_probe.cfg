# BBox Nozzle Probe — XYZ tool offset calibration
# -----------------------------------------------------------------------
# Fixed 3-axis probe switch used to locate each tool's nozzle center and
# compute X/Y/Z offsets relative to T0. Backed by bbox_tools_calibrate.py
# (ported from viesturz/klipper-toolchanger's tools_calibrate.py).
#
# Workflow (see klipper-toolchanger's tools_calibrate.md docs):
#   1. Position the nozzle roughly above the probe (within 1-2mm) - the
#      probe finds the exact center on its own.
#   2. With T0 active, run TOOL_LOCATE_SENSOR to set the baseline.
#   3. For every other tool, run TOOL_CALIBRATE_TOOL_OFFSET to measure its
#      offset from T0. Results are printed to the console.
#   BT_CALIBRATE_ALL_TOOL_OFFSETS automates steps 1-3 across every tool and
#   saves each result via BT_SAVE_TOOL_OFFSET (variables.cfg), replacing
#   the old zprobe_pin/ZPROBE_TOOL_OFFSET Z-only calibration path.
# -----------------------------------------------------------------------

[bbox_tools_calibrate]
#pin: ^pico2:gpio11           # NC switch; pull-up HIGH = open = triggered
travel_speed: 20            # mm/s sideways travel speed between XY probe points
#spread: 7                   # mm to travel outward (X/Y) before probing back inward to find each edge
spread: 5                   # mm to travel outward (X/Y) before probing back inward to find each edge
#lower_z: 1.0                # mm to lower below the top/start position before each XY probe move
lower_z: 0.5                # mm to lower below the top/start position before each XY probe move
speed: 2                    # mm/s probing speed used for the actual contact-seeking moves
lift_speed: 4                # mm/s retract/reposition speed between samples and probe points
final_lift_z: 6             # mm to lift above the found center before parking
sample_retract_dist: 2       # mm to retract between repeated samples at the same point
samples_tolerance: 0.05     # mm; max spread allowed between samples before a retry
samples_tolerance_retries: 3 #how many times you want it to retry before failing.
samples: 5                  # number of samples to average/median per probe point
samples_result: median      # median, average

# Settings for TOOL_CALIBRATE_PROBE_OFFSET only (calibrates the main bed
# probe's z_offset against this nozzle probe). Inert while no bed probe is
# installed/active - relevant again once the Klicky probe is reconnected.
probe: probe                 # name of the bed/print probe object to calibrate
trigger_to_bottom_z: 0.25    # mm offset from this probe's electrical trigger to where the nozzle mechanically bottoms out


#-- Copy the following into your bt_customize.cfg and then edit the values as needed
[gcode_macro _BT_PROBE_CONFIG]
variable_probe_x: 202           # X position of the nozzle probe - UPDATE for your printer
variable_probe_y: 30            # Y position of the nozzle probe - UPDATE for your printer
variable_travel_z: 30           # safe Z height to travel at before moving over the probe
variable_calibrate_temp: 150    # nozzle temp while probing - hot enough to avoid thermal deformation, not so hot it oozes
gcode:

[gcode_macro BT_CALIBRATE_ALL_TOOL_OFFSETS]
description: Locate T0 as the baseline, then measure and save X/Y/Z offsets for every other tool against it.
gcode:
    {% set vars = printer["gcode_macro _BT_PROBE_CONFIG"] %}
    {% set tool_count = printer["gcode_macro _BT_VARIABLES"].x_locs|length %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    G90 # absolute positioning
    T0
    G0 Z{vars.travel_z} F10000
    G0 X{vars.probe_x} Y{vars.probe_y} F10000
    M109 S{vars.calibrate_temp}
    TOOL_LOCATE_SENSOR
    M104 S0
    {% for tool in range(1, tool_count) %}

        # T{tool}
        # G0 Z{vars.travel_z} F10000
        # G0 X{vars.probe_x} Y{vars.probe_y} F10000
        # M109 S{vars.calibrate_temp}
        # TOOL_CALIBRATE_TOOL_OFFSET
        # M104 S0
        # BT_SAVE_LAST_TOOL_OFFSET TOOL={tool}
        BT_CALIBRATE_TOOL_OFFSET TOOL={tool}
    {% endfor %}
    RESPOND MSG="BBox: tool offset calibration complete for {tool_count - 1} tool(s)."

[gcode_macro BT_CALIBRATE_TOOL_BASELINE]
description: Locate T0 as the baseline
gcode:
    {% set vars = printer["gcode_macro _BT_PROBE_CONFIG"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    G90 # absolute positioning
    T0
    G0 Z{vars.travel_z} F10000
    G0 X{vars.probe_x} Y{vars.probe_y} F10000
    M109 S{vars.calibrate_temp}
    TOOL_LOCATE_SENSOR
    M104 S0
    RESPOND MSG="BBox: T0 baseline has been established."

[gcode_macro BT_CALIBRATE_TOOL_OFFSET]
description: Determines current tool offset relative to T0. A call to TOOL_LOCATE_SENSOR must have been made on T0 first (or a call to BT_CALIBRATE_T0_BASELINE), otherwise the results will be meaningless.
gcode:
    {% set vars = printer["gcode_macro _BT_PROBE_CONFIG"] %}
    {% set tool_count = printer["gcode_macro _BT_VARIABLES"].x_locs|length %}
    {% set tool = params.TOOL|int %}
    G90 # absolute positioning
    T{tool}
    G0 Z{vars.travel_z} F10000
    G0 X{vars.probe_x} Y{vars.probe_y} F10000
    M109 S{vars.calibrate_temp}
    TOOL_CALIBRATE_TOOL_OFFSET
    M104 S0
    BT_SAVE_LAST_TOOL_OFFSET TOOL={tool}
    RESPOND MSG="BBox: T{tool} offset calculated and saved."

[gcode_macro BT_SAVE_LAST_TOOL_OFFSET]
description: Saves the most recent TOOL_CALIBRATE_TOOL_OFFSET result for TOOL=<n> via BT_SAVE_TOOL_OFFSET. Lets you recalibrate a single tool from the console without rerunning the full loop, as long as Klipper hasn't restarted since TOOL_LOCATE_SENSOR was last run on T0.
gcode:
    {% set tool = params.TOOL|int %}
    {% set result = printer["bbox_tools_calibrate"] %}
    BT_SAVE_TOOL_OFFSET TOOL={tool} X={"%.4f"|format(result.last_x_result)} Y={"%.4f"|format(result.last_y_result)} Z={"%.4f"|format(result.last_z_result)}

[gcode_macro BT_CALIBRATE_PROBE_OFFSET]
description: Calibrates [probe]'s z_offset against the nozzle probe. Requires a bed probe (e.g. Klicky) to be installed and active - skip until then.
gcode:
    {% set vars = printer["gcode_macro _BT_PROBE_CONFIG"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    G0 Z{vars.travel_z} F10000
    G0 X{vars.probe_x} Y{vars.probe_y} F10000
    M109 S{vars.calibrate_temp}
    TOOL_LOCATE_SENSOR
    TOOL_CALIBRATE_PROBE_OFFSET
    M104 S0
