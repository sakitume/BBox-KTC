# BBox Z Probe — Optional calibration switch
# -----------------------------------------------------------------------
# Adds Z probe configuration to [bbox_toolchanger]. The pin is registered
# as an endstop during startup; ZPROBE_TOOL_OFFSET becomes available.
#
# To disable: comment out or remove this file from your printer.cfg
# includes. The toolchanger will start normally without it.
# -----------------------------------------------------------------------

[bbox_toolchanger]
# Edit bt_customize.cfg and provide a valid mcu:pin for the nozzle probe under a [bbox_toolchanger] section
# the following commented out examples are ones I've used in the past
#zprobe_pin: ^ender3:PC4             # NC switch; pull-up HIGH = open = triggered. Old ender3 board (v1.1) I had
#zprobe_pin: ^pico2:gpio11           # NC switch; pull-up HIGH = open = triggered. SKR-Pico board I use on some of my printers

zprobe_speed: 1.0                   # mm/s descent speed during probe
zprobe_lift_speed: 8.0              # mm/s retract speed between samples and on restore
zprobe_samples: 5                   # number of samples to collect and average
zprobe_samples_tolerance: 0.020     # mm; max spread across samples before retry
zprobe_samples_tolerance_retries: 3 # number of full retry attempts before error
zprobe_max_descend: 20.0            # mm; maximum Z distance to travel downward when probing
